<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TOPIK Study Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Noto+Sans+KR:wght@300;400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0e0e10;
  --surface: #18181c;
  --surface2: #222228;
  --border: #2e2e38;
  --accent: #ff6b35;
  --accent2: #ffd166;
  --green: #06d6a0;
  --blue: #118ab2;
  --text: #f0f0f4;
  --muted: #7a7a8c;
  --red: #ef476f;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Noto Sans KR', sans-serif;
  min-height: 100vh;
  padding: 2rem 1.5rem 4rem;
}

/* Header */
.header {
  display: flex;
  align-items: flex-end;
  gap: 1.5rem;
  margin-bottom: 2.5rem;
  border-bottom: 1px solid var(--border);
  padding-bottom: 1.5rem;
}
.header-title {
  font-family: 'Bebas Neue', sans-serif;
  font-size: clamp(2.5rem, 6vw, 4.5rem);
  letter-spacing: 0.04em;
  line-height: 1;
  color: var(--accent);
}
.header-sub {
  font-family: 'DM Mono', monospace;
  font-size: 0.75rem;
  color: var(--muted);
  letter-spacing: 0.1em;
  text-transform: uppercase;
  margin-bottom: 0.4rem;
}
.korean-tag {
  font-family: 'Noto Sans KR', sans-serif;
  font-size: 1.2rem;
  color: var(--accent2);
  font-weight: 700;
  margin-left: auto;
  background: rgba(255,209,102,0.1);
  border: 1px solid rgba(255,209,102,0.25);
  padding: 0.4rem 1rem;
  border-radius: 4px;
  white-space: nowrap;
}

/* Stats bar */
.stats-bar {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
  gap: 1rem;
  margin-bottom: 2.5rem;
}
.stat-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 1rem 1.25rem;
  position: relative;
  overflow: hidden;
}
.stat-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 2px;
  background: var(--accent);
}
.stat-card.green::before { background: var(--green); }
.stat-card.blue::before { background: var(--blue); }
.stat-card.yellow::before { background: var(--accent2); }
.stat-label {
  font-family: 'DM Mono', monospace;
  font-size: 0.65rem;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  color: var(--muted);
  margin-bottom: 0.5rem;
}
.stat-value {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 2rem;
  line-height: 1;
  color: var(--text);
}
.stat-unit {
  font-size: 0.7rem;
  color: var(--muted);
  margin-top: 0.2rem;
  font-family: 'DM Mono', monospace;
}

/* Phase labels */
.phase-header {
  display: flex;
  align-items: center;
  gap: 1rem;
  margin: 2rem 0 1rem;
}
.phase-tag {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 0.85rem;
  letter-spacing: 0.15em;
  padding: 0.25rem 0.75rem;
  border-radius: 3px;
  background: var(--accent);
  color: #fff;
}
.phase-tag.p2 { background: var(--blue); }
.phase-tag.p3 { background: var(--green); color: #0e0e10; }
.phase-tag.p4 { background: var(--accent2); color: #0e0e10; }
.phase-line {
  flex: 1;
  height: 1px;
  background: var(--border);
}
.phase-label {
  font-size: 0.75rem;
  color: var(--muted);
  font-family: 'DM Mono', monospace;
}

/* Week grid */
.week-grid {
  display: grid;
  gap: 0.75rem;
}
.week-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 1rem 1.25rem;
  cursor: pointer;
  transition: border-color 0.2s, background 0.2s;
  position: relative;
}
.week-card:hover { border-color: var(--accent); background: var(--surface2); }
.week-card.done { border-color: rgba(6,214,160,0.4); }
.week-card.current { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.week-card.special { border-color: rgba(255,209,102,0.5); }

.week-top {
  display: flex;
  align-items: center;
  gap: 0.75rem;
  margin-bottom: 0.75rem;
}
.week-num {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 1.4rem;
  color: var(--muted);
  min-width: 2.5rem;
  line-height: 1;
}
.week-card.current .week-num { color: var(--accent); }
.week-card.done .week-num { color: var(--green); }
.week-date {
  font-family: 'DM Mono', monospace;
  font-size: 0.7rem;
  color: var(--muted);
  letter-spacing: 0.05em;
}
.week-status {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 0.5rem;
}
.badge {
  font-family: 'DM Mono', monospace;
  font-size: 0.6rem;
  padding: 0.2rem 0.6rem;
  border-radius: 3px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}
.badge-done { background: rgba(6,214,160,0.15); color: var(--green); border: 1px solid rgba(6,214,160,0.3); }
.badge-current { background: rgba(255,107,53,0.15); color: var(--accent); border: 1px solid rgba(255,107,53,0.3); }
.badge-special { background: rgba(255,209,102,0.15); color: var(--accent2); border: 1px solid rgba(255,209,102,0.3); }
.badge-locked { background: rgba(122,122,140,0.1); color: var(--muted); border: 1px solid var(--border); }

.week-tasks {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 0.5rem;
}
.task-item {
  display: flex;
  align-items: center;
  gap: 0.6rem;
  font-size: 0.82rem;
  color: var(--muted);
  padding: 0.35rem 0;
  border-bottom: 1px solid rgba(255,255,255,0.04);
  cursor: pointer;
  user-select: none;
  transition: color 0.15s;
}
.task-item:hover { color: var(--text); }
.task-item.checked { color: var(--text); }
.task-check {
  width: 16px; height: 16px;
  border: 1.5px solid var(--border);
  border-radius: 3px;
  flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.15s;
}
.task-item.checked .task-check {
  background: var(--green);
  border-color: var(--green);
}
.task-item.checked .task-check::after {
  content: '✓';
  font-size: 10px;
  color: #0e0e10;
  font-weight: 700;
}

.week-progress {
  margin-top: 0.75rem;
  display: flex;
  align-items: center;
  gap: 0.75rem;
}
.progress-bar {
  flex: 1;
  height: 3px;
  background: var(--border);
  border-radius: 99px;
  overflow: hidden;
}
.progress-fill {
  height: 100%;
  background: var(--green);
  border-radius: 99px;
  transition: width 0.3s;
}
.progress-text {
  font-family: 'DM Mono', monospace;
  font-size: 0.65rem;
  color: var(--muted);
  min-width: 2.5rem;
  text-align: right;
}

/* Vocab counter */
.vocab-track {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  margin-top: 0.75rem;
  padding-top: 0.75rem;
  border-top: 1px solid var(--border);
}
.vocab-label {
  font-family: 'DM Mono', monospace;
  font-size: 0.65rem;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.1em;
}
.vocab-input {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 4px;
  color: var(--text);
  font-family: 'DM Mono', monospace;
  font-size: 0.8rem;
  padding: 0.25rem 0.5rem;
  width: 70px;
  text-align: center;
}
.vocab-input:focus { outline: none; border-color: var(--accent2); }
.vocab-goal { font-family: 'DM Mono', monospace; font-size: 0.65rem; color: var(--muted); }

/* Mock test result */
.mock-result {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  margin-top: 0.75rem;
}
.score-input {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 4px;
  color: var(--accent2);
  font-family: 'Bebas Neue', sans-serif;
  font-size: 1.1rem;
  padding: 0.2rem 0.5rem;
  width: 60px;
  text-align: center;
}
.score-input:focus { outline: none; border-color: var(--accent2); }
.score-label { font-family: 'DM Mono', monospace; font-size: 0.65rem; color: var(--muted); }

/* Overall progress */
.overall-progress {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 1.25rem;
  margin-bottom: 2rem;
}
.overall-title {
  font-family: 'DM Mono', monospace;
  font-size: 0.7rem;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  color: var(--muted);
  margin-bottom: 1rem;
}
.big-progress-bar {
  height: 8px;
  background: var(--border);
  border-radius: 99px;
  overflow: hidden;
  margin-bottom: 0.5rem;
}
.big-progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--accent), var(--accent2));
  border-radius: 99px;
  transition: width 0.5s;
}
.progress-markers {
  display: flex;
  justify-content: space-between;
  font-family: 'DM Mono', monospace;
  font-size: 0.6rem;
  color: var(--muted);
  margin-top: 0.25rem;
}

/* Notes area */
.notes-area {
  width: 100%;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 4px;
  color: var(--muted);
  font-family: 'Noto Sans KR', sans-serif;
  font-size: 0.78rem;
  padding: 0.5rem 0.75rem;
  resize: none;
  margin-top: 0.75rem;
  line-height: 1.5;
  min-height: 48px;
}
.notes-area:focus { outline: none; border-color: var(--muted); color: var(--text); }
.notes-area::placeholder { color: rgba(122,122,140,0.5); }

.current-indicator {
  font-family: 'DM Mono', monospace;
  font-size: 0.6rem;
  color: var(--accent);
  text-transform: uppercase;
  letter-spacing: 0.1em;
  display: flex;
  align-items: center;
  gap: 4px;
}
.dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); animation: pulse 1.5s infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }
</style>
</head>

    'Tự tin: bạn đã chuẩn bị 16 tuần!',
    '한국어 능력 시험 — CHIẾN THÔI! 🔥'
  ], vocab: 2100, hasMock: false, notes: '' },
];

const PHASE_COLORS = { 1: 'p1', 2: 'p2', 3: 'p3', 4: 'p4' };
const PHASE_NAMES = { 1: 'GĐ1 · Nền tảng A2→B1', 2: 'GĐ2 · Lên B1', 3: 'GĐ3 · B2 + Luyện đề', 4: 'GĐ4 · Sprint thi' };

let state = JSON.parse(localStorage.getItem('topik-tracker') || '{}');

function save() {
  localStorage.setItem('topik-tracker', JSON.stringify(state));
  updateStats();
}

function getWeekKey(w) { return 'w' + w; }
function getTaskKey(w, t) { return 'w' + w + 't' + t; }

function toggleTask(week, taskIdx) {
  const key = getTaskKey(week, taskIdx);
  state[key] = !state[key];
  const el = document.querySelector(`[data-task="${key}"]`);
  if (el) el.classList.toggle('checked', state[key]);
  const checkEl = el && el.querySelector('.task-check');
  updateWeekProgress(week);
  save();
}

function updateWeekProgress(week) {
  const wData = WEEKS_DATA[week - 1];
  const total = wData.tasks.length;
  const done = wData.tasks.filter((_, i) => state[getTaskKey(week, i)]).length;
  const pct = total ? Math.round(done / total * 100) : 0;
  const bar = document.querySelector(`[data-progress="${week}"]`);
  const txt = document.querySelector(`[data-progress-text="${week}"]`);
  if (bar) bar.style.width = pct + '%';
  if (txt) txt.textContent = pct + '%';
  const card = document.querySelector(`[data-week="${week}"]`);
  if (card) card.classList.toggle('done', pct === 100);
}

function updateStats() {
  let weeks = 0, tasks = 0;
  WEEKS_DATA.forEach(w => {
    const total = w.tasks.length;
    const done = w.tasks.filter((_, i) => state[getTaskKey(w.week, i)]).length;
    if (done === total) weeks++;
    tasks += done;
  });

  document.getElementById('stat-weeks').textContent = weeks;
  document.getElementById('stat-tasks').textContent = tasks;

  // vocab
  let totalVocab = 0;
  WEEKS_DATA.forEach(w => {
    const v = parseInt(document.querySelector(`[data-vocab="${w.week}"]`)?.value || state['vocab-' + w.week] || 0);
    totalVocab = Math.max(totalVocab, v);
  });
  document.getElementById('stat-vocab').textContent = totalVocab.toLocaleString();

  // score
  let maxScore = 0;
  WEEKS_DATA.forEach(w => {
    if (w.hasMock) {
      const s = parseInt(document.querySelector(`[data-score="${w.week}"]`)?.value || state['score-' + w.week] || 0);
      if (s > maxScore) maxScore = s;
    }
  });
  document.getElementById('stat-score').textContent = maxScore > 0 ? maxScore : '—';

  // big bar
  const totalTasks = WEEKS_DATA.reduce((a, w) => a + w.tasks.length, 0);
  const pct = totalTasks ? Math.round(tasks / totalTasks * 100) : 0;
  document.getElementById('big-bar').style.width = pct + '%';
}

function render() {
  const container = document.getElementById('weeks-container');
  let html = '';
  let lastPhase = 0;

  WEEKS_DATA.forEach(w => {
    if (w.phase !== lastPhase) {
      const tag = PHASE_COLORS[w.phase];
      html += `<div class="phase-header">
        <span class="phase-tag ${tag === 'p1' ? '' : tag}">${'GĐ' + w.phase}</span>
        <div class="phase-line"></div>
        <span class="phase-label">${w.label || PHASE_NAMES[w.phase]}</span>
      </div>`;
      lastPhase = w.phase;
    }

    const totalTasks = w.tasks.length;
    const doneTasks = w.tasks.filter((_, i) => state[getTaskKey(w.week, i)]).length;
    const pct = totalTasks ? Math.round(doneTasks / totalTasks * 100) : 0;
    const isDone = pct === 100;

    let statusBadge = `<span class="badge badge-locked">Chờ</span>`;
    if (isDone) statusBadge = `<span class="badge badge-done">✓ Xong</span>`;
    else if (doneTasks > 0) statusBadge = `<span class="badge badge-current">Đang học</span>`;
    if (w.special) statusBadge = `<span class="badge badge-special">${w.week === 16 ? '🏁 Thi' : '★ Đặc biệt'}</span>`;

    const vocabVal = state['vocab-' + w.week] || '';
    const scoreVal = state['score-' + w.week] || '';
    const notesVal = (state['notes-' + w.week] || '').replace(/"/g, '&quot;');

    html += `<div class="week-card ${isDone ? 'done' : ''} ${w.special ? 'special' : ''}" data-week="${w.week}">
      <div class="week-top">
        <div class="week-num">W${String(w.week).padStart(2,'0')}</div>
        <div>
          <div style="font-size:0.85rem;font-weight:500;color:var(--text);margin-bottom:2px">${w.special && w.specialNote ? w.specialNote : 'Tuần ' + w.week}</div>
          <div class="week-date">${w.date}</div>
        </div>
        <div class="week-status">${statusBadge}</div>
      </div>

      <div class="week-tasks">
        ${w.tasks.map((t, i) => {
          const key = getTaskKey(w.week, i);
          const checked = state[key];
          return `<div class="task-item ${checked ? 'checked' : ''}" data-task="${key}" onclick="toggleTask(${w.week}, ${i})">
            <div class="task-check"></div>
            <span>${t}</span>
          </div>`;
        }).join('')}
      </div>

      <div class="week-progress">
        <div class="progress-bar"><div class="progress-fill" data-progress="${w.week}" style="width:${pct}%"></div></div>
        <div class="progress-text" data-progress-text="${w.week}">${pct}%</div>
      </div>

      <div style="display:flex;gap:1.5rem;flex-wrap:wrap;align-items:center;margin-top:0.75rem;padding-top:0.75rem;border-top:1px solid var(--border)">
        <div class="vocab-track" style="border:none;margin:0;padding:0">
          <span class="vocab-label">Từ vựng tích lũy:</span>
          <input type="number" class="vocab-input" data-vocab="${w.week}" placeholder="0" value="${vocabVal}" min="0" max="6000"
            onchange="state['vocab-${w.week}']=this.value;save()"
            oninput="state['vocab-${w.week}']=this.value;updateStats()">
          <span class="vocab-goal">/ ${w.vocab} mục tiêu</span>
        </div>
        ${w.hasMock ? `<div class="mock-result">
          <span class="score-label">Mock test điểm:</span>
          <input type="number" class="score-input" data-score="${w.week}" placeholder="—" value="${scoreVal}" min="0" max="300"
            onchange="state['score-${w.week}']=this.value;save()"
            oninput="state['score-${w.week}']=this.value;updateStats()">
          <span class="score-label">/ 300 · ${w.mockLabel}</span>
        </div>` : ''}
      </div>

      <textarea class="notes-area" placeholder="Ghi chú tuần này: điểm yếu, từ hay quên, cảm nhận..." rows="2"
        onchange="state['notes-${w.week}']=this.value;save()">${notesVal}</textarea>
    </div>`;
  });

  container.innerHTML = html;
  updateStats();
}

render();
</script>
</body>
</html>
